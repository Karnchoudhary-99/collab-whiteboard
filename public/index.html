<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Whiteboard</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #toolbar { display: flex; gap: 0.75rem; align-items: center; padding: 0.5rem 1rem;
             background: #f4f4f4; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  #toolbar label { font-size: 0.9rem; }
  #board { display: block; width: 100%; height: calc(100vh - 49px);
           touch-action: none; cursor: crosshair; background: #fff; }
  #status { margin-left: auto; font-size: 0.85rem; color: #555; }
  #status.offline { color: #b00; }
</style>
</head>
<body>
<div id="toolbar">
  <label>Color <input id="color" type="color" value="#222222"></label>
  <label>Width <input id="width" type="range" min="1" max="24" value="3"></label>
  <button id="undo" type="button">Undo</button>
  <button id="clear" type="button">Clear</button>
  <label>Room <input id="room" type="text" value="lobby" size="12"></label>
  <span id="status">connecting…</span>
</div>
<canvas id="board" width="1200" height="800"></canvas>
<script type="module" src="/app.js"></script>
</body>
</html>
